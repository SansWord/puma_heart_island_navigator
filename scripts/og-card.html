<!doctype html>
<!-- Source for assets/og.png (1200x630 social preview). Regenerate with scripts/og.sh. -->
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=block">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #db6a41;
    color: #211d1d;
    font-family: "Noto Sans TC", "PingFang TC", sans-serif;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
  }
  .eyebrow {
    align-self: flex-start;
    padding: 6px 18px;
    border-radius: 999px;
    background: #fff;
    color: #ad4d2a;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: .12em;
  }
  h1 { margin: 28px 0 0; color: #fff; font-size: 84px; font-weight: 900; line-height: 1.15; }
  .lede { margin: 18px 0 0; font-size: 36px; font-weight: 700; }
  .years { display: flex; gap: 14px; margin-top: auto; }
  .years span {
    flex: 1;
    padding: 16px 0;
    border-radius: 14px;
    background: #fff8f4;
    box-shadow: 0 -6px 0 0 #fcea8b;
    text-align: center;
    font-size: 34px;
    font-weight: 900;
    color: #ad4d2a;
  }
</style>
</head>
<body>
  <div class="eyebrow">非官方整理</div>
  <h1>沈伯洋 HEART 政策島<br>導航器</h1>
  <p class="lede">每一項政見，依承諾的期程排開</p>
  <div class="years"><span>短期</span><span>中期</span><span>長期</span><span>分階段</span><span>施政方向</span></div>
</body>
</html>

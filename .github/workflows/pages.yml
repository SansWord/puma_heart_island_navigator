name: Deploy to GitHub Pages

# No scheduled sync: official data is pulled with scripts/sync.py, reviewed, and committed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Preview images are cached by content hash, so only new or changed policies render.
      # A fresh key every run saves the updated cache; restore-keys picks up the latest one.
      - uses: actions/cache@v4
        with:
          path: .cache/og
          key: og-${{ github.run_id }}
          restore-keys: og-
      # One link-preview page + image per policy (p/<id>/). The runner has Chrome; the CJK fonts
      # back up Google Fonts, and are only installed when something needs rendering.
      # Failed images fall back to assets/og.png.
      - name: Generate share pages
        run: |
          if [ "$(python3 scripts/share_pages.py --missing)" != 0 ]; then
            { sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk; } >/dev/null || echo "::warning::fonts-noto-cjk install failed"
          fi
          python3 scripts/share_pages.py --images
          rm -rf docs scripts README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

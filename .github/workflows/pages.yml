name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * *" # 04:17 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch policies.json (falls back to the committed snapshot)
        run: |
          if curl -fsSL "https://puma.taipei/heart-island-assets/policies.json?t=$(date +%s)" -o /tmp/policies.json \
            && python3 -c "import json; d = json.load(open('/tmp/policies.json')); assert d.get('islands'), 'no islands in payload'"; then
            cp /tmp/policies.json data/policies.json
            printf '{"fetchedAt":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/sync.json
          else
            echo "::warning::Fetch failed; deploying the committed snapshot"
          fi
          rm -rf docs scripts README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
